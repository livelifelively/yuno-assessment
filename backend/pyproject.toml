[project]
name = "yuno-backend"
version = "0.0.0"
description = "yuno backend — FastAPI + SQLModel + CrewAI (V1, batch 0 scaffold)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.10.1",
    "sqlmodel==0.0.38",
    "psycopg[binary]==3.3.4",
    "alembic==1.18.4",
    "crewai[google-genai]==1.14.5",
    "litellm==1.86.0",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
