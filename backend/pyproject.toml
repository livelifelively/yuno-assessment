[project]
name = "yuno-backend"
version = "0.0.0"
description = "yuno backend — FastAPI + SQLModel + CrewAI (V1, batch 0 scaffold)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlmodel",
    "psycopg[binary]",
    "alembic",
    "crewai[google-genai]",
    "litellm",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
